name: EV charger
products:
  - id: 7bvgooyjhiua1yyq
    manufacturer: "Smart Charging Case"
    model: "22 kW - GD4301"
entities:
  - entity: sensor
    translation_key: status
    class: enum
    icon: "mdi:ev-station"
    dps:
      - id: 101
        type: string
        name: sensor
        mapping:
          - dps_val: no_connet
            value: available
          - dps_val: connect
            value: plugged_in
          - dps_val: charing
            value: charging
          - dps_val: wait_rfid
            value: waiting_for_authorization
          - dps_val: finish
            value: charged
          - dps_val: wait_charing
            value: waiting
          - dps_val: error
            value: fault
      - id: 3
        type: string
        optional: true
        name: work_state

  - entity: select
    name: Charging operation
    icon: "mdi:ev-station"
    category: config
    dps:
      - id: 124
        type: string
        name: option
        mapping:
          - dps_val: OpenCharging
            value: Start charging
          - dps_val: CloseCharging
            value: Stop charging
          - dps_val: WaitOperation
            value: "No operation"

  # Angepasst für 22kW: Nutzt DP 115 (Set32A) statt DP 114
  - entity: number
    name: Charge current
    category: config
    class: current
    dps:
      - id: 115
        type: integer
        name: value
        unit: A
        range:
          min: 6
          max: 32

  - entity: number
    name: Delay
    class: duration
    category: config
    dps:
      - id: 118
        type: integer
        name: value
        unit: h
        range:
          min: 0
          max: 15

  - entity: sensor
    class: energy
    dps:
      - id: 112
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 10

  # --- SPANNUNG DER 3 PHASEN ---
  - entity: sensor
    name: Voltage L1
    class: voltage
    category: diagnostic
    dps:
      - id: 102
        type: integer
        name: sensor
        unit: V
        class: measurement

  - entity: sensor
    name: Voltage L2
    class: voltage
    category: diagnostic
    dps:
      - id: 103
        type: integer
        name: sensor
        unit: V
        class: measurement

  - entity: sensor
    name: Voltage L3
    class: voltage
    category: diagnostic
    dps:
      - id: 104
        type: integer
        name: sensor
        unit: V
        class: measurement

  # --- STROMSTÄRKE DER 3 PHASEN ---
  - entity: sensor
    name: Current L1
    class: current
    category: diagnostic
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: A
        class: measurement
        mapping:
          - scale: 10

  - entity: sensor
    name: Current L2
    class: current
    category: diagnostic
    dps:
      - id: 106
        type: integer
        name: sensor
        unit: A
        class: measurement
        mapping:
          - scale: 10

  - entity: sensor
    name: Current L3
    class: current
    category: diagnostic
    dps:
      - id: 107
        type: integer
        name: sensor
        unit: A
        class: measurement
        mapping:
          - scale: 10

  # --- LEISTUNG, TEMPERATUR UND DIAGNOSE ---
  - entity: sensor
    class: power
    category: diagnostic
    dps:
      - id: 109
        type: integer
        name: sensor
        unit: kW
        class: measurement
        mapping:
          - scale: 10

  - entity: sensor
    class: temperature
    category: diagnostic
    dps:
      - id: 110
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10

  - entity: number
    name: Charging duration
    category: config
    icon: "mdi:car-clock"
    dps:
      - id: 119
        type: integer
        name: value
        unit: h
        range:
          min: 0
          max: 15

  - entity: sensor
    name: Charging time
    class: duration
    dps:
      - id: 120
        type: integer
        optional: true
        name: sensor
        unit: h
        mapping:
          - scale: 10

  # Diagnose-Sensor für den aktiven Phasen-Modus
  - entity: sensor
    name: Phase Mode
    category: diagnostic
    icon: "mdi:sine-wave"
    dps:
      - id: 108
        type: string
        name: sensor
        mapping:
          - dps_val: Single_phase
            value: Single Phase
          - dps_val: Three_phase
            value: Three Phase
          - dps_val: No_phase
            value: No Phase
          - dps_val: Phase_err
            value: Phase Error

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 10
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 10
        type: bitfield
        name: fault_code
